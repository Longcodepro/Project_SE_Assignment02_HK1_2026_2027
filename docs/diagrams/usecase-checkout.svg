ial">•</text><text x="773.632" y="532.24" fill="#000" font-size="12" textLength="158.545" font-weight="700" font-family="Arial">Server-side Pricing (FR-05):</text><text x="935.297" y="532.24" fill="#000" font-size="12" textLength="148.477" font-family="Arial">Server tự tính giá từ CSDL,</text><text x="772.24" y="548.584" fill="#000" font-size="12" textLength="225.134" font-family="Arial">tuyệt đối không cho client gửi tổng tiền.</text><text x="766" y="564.928" fill="#000" font-size="12" font-family="Arial">•</text><text x="773.632" y="564.928" fill="#000" font-size="12" textLength="135.997" font-weight="700" font-family="Arial">Thanh toán mô phỏng:</text><text x="912.749" y="564.928" fill="#000" font-size="12" textLength="157.069" font-family="Arial">Thẻ ngân hàng (CARD) hoặc</text><text x="772.24" y="581.272" fill="#000" font-size="12" textLength="255.086" font-family="Arial">Ví điện tử (WALLET), 2 phương thức duy nhất.</text><text x="766" y="597.617" fill="#000" font-size="12" font-family="Arial">•</text><text x="773.632" y="597.617" fill="#000" font-size="12" textLength="151.873" font-weight="700" font-family="Arial">Idempotency-Key (FR-09):</text><text x="928.625" y="597.617" fill="#000" font-size="12" textLength="200.545" font-family="Arial">Header key duy nhất chống trừ tiền</text><text x="772.24" y="613.961" fill="#000" font-size="12" textLength="224.474" font-family="Arial">và chống tạo đơn trùng khi mạng bị trễ.</text><text x="766" y="630.305" fill="#000" font-size="12" font-family="Arial">•</text><text x="773.632" y="630.305" fill="#000" font-size="12" textLength="143.437" font-weight="700" font-family="Arial">Khóa lạc quan (version):</text><text x="920.189" y="630.305" fill="#000" font-size="12" textLength="168.133" font-family="Arial">Kiểm soát xung đột trạng thái</text><text x="772.24" y="646.649" fill="#000" font-size="12" textLength="245.342" font-family="Arial">đồng thời (Optimistic Concurrency Control).</text><text x="766" y="662.993" fill="#000" font-size="12" font-family="Arial">•</text><text x="773.632" y="662.993" fill="#000" font-size="12" textLength="206.113" font-weight="700" font-family="Arial">Mô phỏng từ chối (Negative Path):</text><text x="772.24" y="679.337" fill="#000" font-size="12" textLength="56.136" font-family="Arial">- Thẻ đuôi</text><text x="831.496" y="679.337" fill="#000" font-size="12" textLength="27.456" font-weight="700" font-family="Arial">0000</text><text x="858.953" y="679.337" fill="#000" font-size="12" textLength="72.601" font-family="Arial">: Từ chối thẻ.</text><text x="772.24" y="695.681" fill="#000" font-size="12" textLength="42.612" font-family="Arial">- Ví đơn</text><text x="817.972" y="695.681" fill="#000" font-size="12" textLength="62.376" font-weight="700" font-family="Arial">> 500.000đ</text><text x="880.349" y="695.681" fill="#000" font-size="12" textLength="158.557" font-family="Arial">: Từ chối do quá hạn mức ví.</text></g><!--link Customer to UC05--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-source-line="48" data-link-type="dependency"><path d="M73.06,282.068 C90.25,282.068 107.53,282.068 130.65,282.068" style="stroke:#181818;stroke-width:1;" fill="none" id="Customer-to-UC05"/><polygon points="135.65,282.068,126.65,278.068,130.65,282.068,126.65,286.068,135.65,282.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link UC05 to PaymentGateway--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk10" data-source-line="49" data-link-type="dependency"><path d="M363.82,300.998 C513.02,328.208 777.761,376.481 892.291,397.361" style="stroke:#181818;stroke-width:1;" fill="none" id="UC05-to-PaymentGateway"/><polygon points="897.21,398.258,889.073,392.709,892.291,397.361,887.639,400.579,897.21,398.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link UC05 to UC06--><g class="link" data-entity-1="ent0004" 
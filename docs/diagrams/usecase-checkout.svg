" cy="244.268" rx="8" ry="8" fill="#EAEDED" style="stroke:#2C3E50;stroke-width:1.2;"/><path d="M39.408,252.268 L39.408,279.268 M26.408,260.268 L52.408,260.268 M39.408,279.268 L26.408,294.268 M39.408,279.268 L52.408,294.268" style="stroke:#2C3E50;stroke-width:1.2;" fill="none"/><text x="6" y="309.296" fill="#000" font-size="12" textLength="66.816" font-family="Arial">Khách hàng</text><text x="6" y="325.64" fill="#000" font-size="12" textLength="62.484" font-family="Arial">(Customer)</text></g><!--entity PaymentGateway--><g class="entity" data-qualified-name="PaymentGateway" id="ent0002" data-source-line="30"><ellipse cx="931.51" cy="378.612" rx="8" ry="8" fill="#EAEDED" style="stroke:#2C3E50;stroke-width:1.2;"/><path d="M931.51,386.612 L931.51,413.612 M918.51,394.612 L944.51,394.612 M931.51,413.612 L918.51,428.612 M931.51,413.612 L944.51,428.612" style="stroke:#2C3E50;stroke-width:1.2;" fill="none"/><text x="877" y="443.64" fill="#000" font-size="12" textLength="94.933" font-family="Arial">Cổng thanh toán</text><text x="877" y="459.984" fill="#000" font-size="12" textLength="109.021" font-family="Arial">(Payment Gateway)</text><text x="883.78" y="365.896" fill="#000" font-size="12" textLength="95.461" font-style="italic" font-family="Arial">«External System»</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="61"><path d="M760,503.068 L760,699.197 A5,5 0 0 0 765,704.197 L1098.322,704.197 A5,5 0 0 0 1103.322,699.197 L1103.322,508.068 L1093.322,498.068 L765,498.068 A5,5 0 0 0 760,503.068" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1093.322,498.068 L1093.322,505.568 A2.5,2.5 0 0 0 1095.822,508.068 L1103.322,508.068 L1093.322,498.068" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="766" y="515.896" fill="#000" font-size="12" textLength="212.689" font-weight="700" font-family="Arial">Quy tắc an ninh &amp; nghiệp vụ cốt lõi:</text><text x="766" y="532.24" fill="#000" font-size="12" font-family="Arial">•</text><text x="773.632" y="532.24" fill="#000" font-size="12" textLength="158.545" font-weight="700" font-family="Arial">Server-side Pricing (FR-05):</text><text x="935.297" y="532.24" fill="#000" font-size="12" textLength="148.477" font-family="Arial">Server tự tính giá từ CSDL,</text><text x="772.24" y="548.584" fill="#000" font-size="12" textLength="225.134" font-family="Arial">tuyệt đối không cho client gửi tổng tiền.</text><text x="766" y="564.928" fill="#000" font-size="12" font-family="Arial">•</text><text x="773.632" y="564.928" fill="#000" font-size="12" textLength="135.997" font-weight="700" font-family="Arial">Thanh toán mô phỏng:</text><text x="912.749" y="564.928" fill="#000" font-size="12" textLength="157.069" font-family="Arial">Thẻ ngân hàng (CARD) hoặc</text><text x="772.24" y="581.272" fill="#000" font-size="12" textLength="255.086" font-family="Arial">Ví điện tử (WALLET), 2 phương thức duy nhất.</text><text x="766" y="597.617" fill="#000" font-size="12" font-family="Arial">•</text><text x="773.632" y="597.617" fill="#000" font-size="12" textLength="151.873" font-weight="700" font-family="Arial">Idempotency-Key (FR-09):</text><text x="928.625" y="597.617" fill="#000" font-size="12" textLength="158.569" font-family="Arial">Header UUID chống trừ tiền</text><text x="772.24" y="613.961" fill="#000" font-size="12" textLength="224.474" font-family="Arial">và chống tạo đơn trùng khi mạng bị trễ.</text><text x="766" y="630.305" fill="#000" font-size="12" font-family="Arial">•</text><text x="773.632" y="630.305" fill="#000" font-size="12" textLength="143.437" font-weight="700" font-family="Arial">Khóa lạc quan (version):</text><text x="920.189" y="630.305" fill="#000" font-size="12" textLength="168.133" font-family="Arial">Kiểm soát xung đột trạng thái</text><text x="772.24" y="646.649" fill="#000" font-size="12" textLength="245.342" font-family="Arial">đồng thời (Optimistic Concurrency Control).</text><text x="766" y="662.993" fill="#000" font-size="12" font-family="Arial">•</text><text x="773.632" y="662.993" fill="#000" font-size="12" textLength="206.113" font-weight="700" font-family="Arial">Mô phỏng từ chối (Negative Path):</text><text x="772.24" y="679.337" fill="#000" font-size="12" textLength="56.136" font-family="Arial">- Thẻ đuôi</text><text x="831.496" y="679.337" fill="#000" font-size="12" textLength="27.456" font-weight="700" font-family="Arial">0000</text><text x="858.953" y="679.337" fill="#000" font-size="12" textLength="72.601" font-family="Arial">: Từ chối thẻ.</text><text x="772.24" y="695.681" fill="#000" font-size="12" textLength="42.612" font-family="Arial">- Ví đơn</text><text x="817.972" y="695.681" fill="#000" font-size="12" textLength="62.376" font-weight="700" font-family="Arial">> 500.000đ</text><text x="880.349" y="695.681" fill="#000" font-size="12" textLength="158.557" font-family="Arial">: Từ chối do quá hạn mức ví.</text></g><!--link Customer to UC05--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-source-line="48" data-link-type="dependency"><path d="M73.06,282.068 C90.25,282.068 107.53,282.068 130.65,282.068" style="stroke:#181818;stroke-width:1;" fill="none" id="Customer-to-UC05"/><polygon points="135.65,282.068,126.65,278.068,130.65,282.068,126.65,286.068,135.65,282.068" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link UC05 to PaymentGateway--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk10" data-source-line="49" data-link-type="dependency"><path d="M362.93,301.408 C507.38,328.558 760.136,376.054 871.666,397.014" style="stroke:#181818;stroke-width:1;" fill="none" id="UC05-to-PaymentGateway"/><polygon points="876.58,397.938,868.474,392.344,871.666,397.014,866.996,400.207,876.58,397.938" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link UC05 to UC06--><g class="link" data-entity-1="ent0004" data-entit
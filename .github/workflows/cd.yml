name: CD

# Tự động đóng gói và xuất bản Docker Image khi code merge vào main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-backend:
    name: "Đóng gói & Đẩy Backend Docker Image lên GHCR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh nhãn và tag metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build và Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deploy-and-verify:
    name: "Kích hoạt Triển khai & Kiểm tra Production"
    runs-on: ubuntu-latest
    needs: [publish-backend]
    steps:
      - name: Kích hoạt Webhook Deploy (Render / Cloud nếu có secret)
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "🚀 Đang gửi tín hiệu kích hoạt Deploy tới Render..."
            curl -X POST "$DEPLOY_HOOK"
            echo "✓ Đã kích hoạt deploy thành công!"
          else
            echo "ℹ Bỏ qua bước webhook (Chưa cấu hình secret RENDER_DEPLOY_HOOK_URL)."
          fi

      - name: Smoke Test URL Production trực tiếp (nếu có secret URL)
        env:
          PROD_URL: ${{ secrets.PRODUCTION_BACKEND_URL }}
        run: |
          if [ -n "$PROD_URL" ]; then
            echo "⏳ Đang chờ hệ thống Production hoàn tất deploy (chờ 30s)..."
            sleep 30
            echo "🔍 Kiểm tra endpoint /health tại: $PROD_URL/health"
            curl --fail --retry 10 --retry-delay 5 "$PROD_URL/health"
            echo "✓ Production đã hoạt động bình thường!"
          else
            echo "ℹ Bỏ qua bước kiểm tra URL Production trực tiếp (Chưa cấu hình secret PRODUCTION_BACKEND_URL)."
          fi

name: CI

# Chạy mỗi khi có Pull Request và khi push vào main.
# Không dùng path filter: các job dưới đây là "required check" của main,
# nếu bị bỏ qua thì PR sẽ chờ mãi.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Build image và chạy thử cả 3 service bằng docker compose.
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tạo .env từ .env.example
        run: cp .env.example .env
      - name: Build và chạy
        run: docker compose up -d --build
      - name: Backend trả lời
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:4000
      - name: Log khi lỗi
        if: failure()
        run: docker compose logs
      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
